<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">MedAdaptAgent — a little help with a new domain</title><desc id="desc">A friendly mint robot accompanies a medical imaging model from its source to a new site, with inspection, adaptation and a delivery decision.</desc>
<defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#dbe4dc"/></pattern></defs>
<rect width="1200" height="390" rx="28" fill="#f7f8f1"/><rect x="730" y="0" width="470" height="390" rx="28" fill="url(#dots)"/>
<g font-family="Arial,Helvetica,sans-serif"><rect x="52" y="44" width="255" height="28" rx="14" fill="#e4ede5"/><text x="69" y="63" font-size="11" letter-spacing="1.5" fill="#366456">A LITTLE HELP WITH A NEW DOMAIN</text>
<text x="50" y="145" font-family="Georgia,serif" font-size="67" letter-spacing="-2" fill="#233e45">MedAdaptAgent</text>
<text x="54" y="192" font-size="22" fill="#526a6d">New site. Same model. Let’s help it settle in.</text>
<text x="54" y="237" font-size="15" fill="#617276">A budget-aware adaptation harness for medical imaging.</text>
