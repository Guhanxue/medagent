[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medadaptagent"
version = "0.1.0"
description = "Budget-aware adaptation of medical imaging models"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
  "torch>=2.4", "torchvision", "numpy>=1.24,<2", "scipy", "scikit-image",
  "cloudpickle>=3,<4", "requests>=2.32", "opencv-python-headless>=4.8,<4.12", "scikit-learn", "Pillow", "nibabel", "monai>=1.4", "timm", "openai>=1.0,<2", "httpx>=0.27,<0.29", "pyyaml"
]

[project.optional-dependencies]
models = ["transformers", "huggingface-hub", "SimpleITK", "pydicom"]
anthropic = ["anthropic"]
dev = ["pytest", "build"]

[project.scripts]
medadapt-demo = "medadaptagent.demo.server:main"
medadapt = "medadaptagent.cli:main"
medadapt-legacy = "medadaptagent.__main__:main"

[tool.setuptools]
license-files = ["LICENSE", "NOTICE"]

[tool.setuptools.packages.find]
include = ["medadaptagent*", "harness*", "scripts*", "tasks*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.yml", "*.html"]

"medadaptagent.demo" = ["samples/*.npz", "samples/*.json", "samples/*.md"]
